[project]
name = "nexa-engineering-universe"
version = "0.1.0"
description = "Research-driven AI engineering repository"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NEXA" }]
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
